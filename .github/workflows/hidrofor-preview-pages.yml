name: Hidrofor Preview Pages

on:
  push:
    branches:
      - main
    paths:
      - 'hidrofor-preview/**'
      - 'hidrofor-service-preview/**'
      - '.github/workflows/hidrofor-preview-pages.yml'
  workflow_dispatch:

concurrency:
  group: hidrofor-preview-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout main — singura sursa publicata
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source
          persist-credentials: false

      - name: Verificare minima a editorului avansat
        shell: bash
        run: |
          set -euo pipefail
          node --check main-source/hidrofor-preview/advanced-programs.js
          node --check main-source/hidrofor-preview/e10-advanced-engine.js
          node --test main-source/hidrofor-preview/tests/e10-advanced-engine.test.cjs

      - name: Build static public and working previews from main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/hidrofor-preview site/hidrofor-service-preview site/hidrofor-lucru
          cp -a main-source/hidrofor-preview/. site/hidrofor-preview/
          cp -a main-source/hidrofor-service-preview/. site/hidrofor-service-preview/
          cp -a main-source/hidrofor-preview/. site/hidrofor-lucru/
          # Working URL: direct application, not the phone frame.
          cp main-source/hidrofor-preview/app.html site/hidrofor-lucru/index.html
          cp main-source/hidrofor-preview/index.html site/hidrofor-lucru/telefon.html
          touch site/.nojekyll
          test -s site/hidrofor-lucru/index.html
          test -s site/hidrofor-lucru/e10-lab.html
          test -s site/hidrofor-lucru/r18-schedules.js
          test -s site/hidrofor-lucru/advanced-programs.js
          grep -q 'id="ap-open"' site/hidrofor-lucru/app.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
