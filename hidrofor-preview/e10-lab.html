<p>Editor ON/OFF, FIX, SMART și ADAPTIVE, comparații și simulare de defecte cu date CLIMATICE SINTETICE. Nu trimite comenzi către ESP32, releu sau hidrofor.</p>

<script>
/* E10-P1: pure, deterministic OFFLINE sequence dry-run. No hardware, web or storage calls.
 * A visualization/test model of the existing 4-minute safe-segment policy, NOT
 * a replacement for HydroforAutomationEngine or a real ESP-NOW confirmation.
 */
(function (root, factory) {

  const DEFAULT_PLAN = Object.freeze({
    version:1, name:'Udare dimineața', start:'07:00', steps:[

    if (sec>MAX_TOTAL_SECONDS) throw new Error('Execuția simulată depășește limita conservatoare de 4 ore. Reduceți duratele.');
    // Fault injection is a VISUAL model: hardware STOP is NOT issued here.
    const faultSec=options && options.faultAtSeconds != null ? options.faultAtSeconds : null;
    if (faultSec !== null) {
      if (!Number.isInteger(faultSec) || faultSec<0 || faultSec>sec) throw new Error('Momentul defectului este invalid.');
      const labels={LINK:'Pierderea ESP-NOW',DRY:'Fără apă',BATTERY:'Baterie critică',RTC:'Ceas invalid'};
      const faultName=options.faultType && labels[options.faultType] ? labels[options.faultType] : 'Defect';

    normalized,build,stateAt,wallClock});

/* E10 integrated offline-only DECISION MODEL.

      reasonSchema,reasonCode,uptimeMs:nowMs,hasEpoch:false,epochSeconds:0,

      hasAdaptiveDetails:method===2&&option.eligible,

      selectedGreenhouse:method===2&&option.eligible?c.climateDetails.selectedGreenhouse:0,
      tempTermPercent:method===2&&option.eligible?c.climateDetails.tempTermPercent:[0,0],
      humidityTermPercent:method===2&&option.eligible?c.climateDetails.humidityTermPercent:[0,0],

(function(root,factory){
  if(typeof module==='object' && module.exports)module.exports=factory();

})(typeof globalThis==='object'?globalThis:this,function(){
  'use strict';
  const names=['FIX','SMART','ADAPTIVE'];
  const states=['Decizie','Blocat','START solicitat','START confirmat','Încheiat','Eșuat'];
  const validUInt=n=>Number.isInteger(n)&&n>=0&&n<=0xffffffff;
  function minutes(d,name,flag,limit){return d[flag]===true && Number.isInteger(d[name]) && d[name]>=1 && d[name]<=limit ? d[name] : null;}
  function climate(c){
    if(!c || c.available!==true || !Number.isInteger(c.temperatureTenths) ||
       c.temperatureTenths < -400 || c.temperatureTenths > 850 ||
       !Number.isInteger(c.humidityTenths) || c.humidityTenths<0 || c.humidityTenths>1000 ||
       !validUInt(c.receptionAgeMs) || typeof c.fresh!=='boolean')return null;
    return {temperatureC:c.temperatureTenths/10,humidityPct:c.humidityTenths/10,
      receptionAgeMs:c.receptionAgeMs,fresh:c.fresh};

  function normalise(r){
    if(!r || !r.decision || !validUInt(r.id) || r.id===0)return null;
    const d=r.decision;
    // Older records predate durationScope and are always single-run records.
    const scope=d.durationScope===undefined ? 0 : d.durationScope;
    if(!Number.isInteger(scope) || ![0,1].includes(scope))return null;
    if(!Number.isInteger(d.method)||d.method<0||d.method>2||![0,1].includes(d.kind)||
       typeof d.eligible!=='boolean'||!Number.isInteger(r.state)||r.state<0||r.state>5||!validUInt(d.uptimeMs))return null;

       typeof r.hasRequestTime!=='boolean'||typeof r.hasAckTime!=='boolean'||typeof r.hasFinishTime!=='boolean')return null;
    const limit=scope===1?240:120;
    const base=minutes(d,'baseMinutes','hasBaseMinutes',limit), proposed=minutes(d,'proposedMinutes','hasProposedMinutes',limit);
    if((d.hasBaseMinutes && base===null)||(d.hasProposedMinutes && proposed===null)||(d.eligible && proposed===null)||

    if(r.hasAckTime && (!r.hasRequestTime||!validUInt(r.ackUptimeMs)))return null;
    if(r.hasFinishTime && !validUInt(r.finishUptimeMs))return null;
    const chronological=(a,b)=>((a-b)>>>0)<0x80000000;
    if((r.hasRequestTime&&!chronological(r.requestUptimeMs,d.uptimeMs)) ||
       (r.hasAckTime&&!chronological(r.ackUptimeMs,r.requestUptimeMs)) ||
       (r.hasFinishTime&&!chronological(r.finishUptimeMs,r.hasAckTime?r.ackUptimeMs:r.hasRequestTime?r.requestUptimeMs:d.uptimeMs)))return null;

       (r.state===3 && r.hasFinishTime))return null;

      terminalReason:Number.isInteger(r.terminalReason)?r.terminalReason:0,
      epoch:d.hasEpoch===true&&validUInt(d.epochSeconds)&&d.epochSeconds>0?d.epochSeconds:null,
      uptimeMs:d.uptimeMs,greenhouse1:climate(d.greenhouse1),greenhouse2:climate(d.greenhouse2),
      adaptive:(d.hasAdaptiveDetails===true && d.method===2 && Number.isInteger(d.factorPercent) && d.factorPercent>=1 && d.factorPercent<=100 &&

        {factor:d.factorPercent,selected:d.selectedGreenhouse,temp:d.tempTermPercent,humidity:d.humidityTermPercent,score:d.scorePercent}:null};
  }
  function reasonText(r){
    const climate=['date disponibile','vârstă maximă invalidă','sera 1 lipsă','sera 2 lipsă','sursă sera 1 neacceptată','sursă sera 2 neacceptată','valori sera 1 invalide','valori sera 2 invalide','sera 1 veche','sera 2 veche'];
    const families={1:['dezactivat','configurație invalidă','climă indisponibilă','condiție neîndeplinită','eligibil'],2:['dezactivat','profil invalid','climă respinsă','durată calculată'],3:['secvență ajustată','secvență invalidă','profil respins','climă respinsă','total prea mic pentru pașii ON','eroare de calcul']};

    return ((r.reasonSchema===1 || r.reasonSchema===2) && major===2) || (r.reasonSchema===3 && major===3) ? `${text}; ${climate[detail]??('cod climă '+detail)}` : text;
  }
  function summarise(payload){

    el('p','Istoric în RAM, maximum 32 de decizii; se pierde la repornire. Comparația privește doar înregistrările disponibile, nu tot istoricul instalației.');
    el('p','Metodele pot avea număr și condiții diferite de înregistrare; mediile nu demonstrează eficiența și nu reprezintă neapărat o comparație pe aceleași scenarii.');
    if(stats.truncated)el('p','Istoricul este parțial: cele mai vechi decizii au fost eliminate.');
    if(stats.invalid)el('p',stats.invalid+' înregistrări incomplete sau invalide au fost excluse.');
    el('p','START solicitat este o cerere; START confirmat indică un ACK valid și releu raportat pornit, nu timp măsurat sau volum pompat. Duratele propuse sunt planuri, nu funcționare măsurată.');
    el('p','Duratele sunt agregate separat: udare simplă sau totalul pașilor ON ai unei secvențe (fără pauze OFF și de protecție).');
    el('p','Eligibilitatea simulată arată numai rezultatul regulii și nu verifică apa, bateria, releul sau celelalte condiții de pornire.');
    for(let kind=0;kind<2;kind++){
      el('h4',kind===0?'Execuții reale':'Simulări — separate de execuții');
      const table=el('table',null),caption=el('caption','Comparație pe metoda deciziei',table),head=el('thead',null,table),tr=el('tr',null,head);
      for(const name of ['Metodă','Decizii','Eligibile','START cerut','START confirmat','Blocate','Eșuate','Durată propusă: total / medie / număr'])el('th',name,tr);
      const body=el('tbody',null,table);
      for(const v of stats.byKind[kind]){const row=el('tr',null,body);const plan=v.plannedByScope.map((p,i)=>`${i?'total ON secvență':'udare simplă'}: `+(p.plannedCount?`${p.plannedTotal} min / ${p.plannedAverage.toFixed(1)} min / ${p.plannedCount}`:'indisponibil')).join('; ');for(const val of [v.name,v.decisions,v.eligible,v.requested,v.ack,v.blocked,v.failed,plan])el('td',String(val),row);}
    }

    const table=el('table',null),head=el('thead',null,table),tr=el('tr',null,head);
    for(const name of ['ID','Tip','Metodă','Eligibilă','Bază / propus','Stare','Motiv','Calcul adaptiv','Sera 1 aer','Sera 2 aer','Moment'])el('th',name,tr);
    const body=el('tbody',null,table),showClimate=c=>c?`${c.temperatureC.toFixed(1)} °C, ${c.humidityPct.toFixed(1)}% RH (${c.fresh?'proaspătă':'veche'}, vârstă la decizie ${Math.floor(c.receptionAgeMs/1000)} s)`:'indisponibil';
    for(const r of stats.rows.slice().reverse()){
      const row=el('tr',null,body),when=r.epoch!==null?new Date(r.epoch*1000).toISOString():`uptime ${r.uptimeMs} ms`;
      const a=r.adaptive,detail=a?`factor ${a.factor}%; sera ${a.selected}; T ${a.temp.join('/')}, RH ${a.humidity.join('/')}, scor ${a.score.join('/')}%`:'—';

<script>
/* E10-P1: offline editor + dry run. Intentionally never calls fetch/apiFetch/ESP-NOW.
 * Browser localStorage stores unarmed DRAFTS only, never ESP32 schedule entries.
 */
(() => {
  'use strict';
  const Engine = window.HidroforSequenceDryRun;
  const Modes = window.HidroforE10ClimateModes;
  const ComparisonUI = window.E10ComparisonUI;
  if (!Engine || !Modes || !ComparisonUI) return;
  const $ = id => document.getElementById(id);
  const KEY = 'hidrofor-e10-dryrun-drafts-v1';
  const MAX_SAVED = 8;
  const copy = data => JSON.parse(JSON.stringify(data));
  let records = [], selected = -1, current = copy(Engine.DEFAULT_PLAN), preview = null;
  let fault = 'NONE';
  let lastComparison = null;
  let comparisonRecords = [];
  let comparisonNextId = 1;
  const safeText = (node,value) => {if(node) node.textContent=String(value);};
  const asMinute = n => Math.floor(n/60)+'m '+String(n%60).padStart(2,'0')+'s';
  const create = (tag,cl,txt) => {const el=document.createElement(tag);if(cl)el.className=cl;if(txt!==undefined)el.textContent=txt;return el;};
  function notice(msg) {safeText($('e10Message'),msg);}
  function readSaved() {
    try {
      const raw=JSON.parse(localStorage.getItem(KEY)||'[]');
      if (!Array.isArray(raw)) return [];
      return raw.slice(0,MAX_SAVED).flatMap(x=>{try{return [Engine.normalized(x)];}catch(_){return [];}});
    } catch(_) {return [];}
  }
  function persist() {
    try {localStorage.setItem(KEY,JSON.stringify(records));return true;}
    catch(_) {notice('Nu am putut salva în acest browser (spațiu/permisiuni).');return false;}
  }
  function updateSelect() {
    const el=$('e10Saved');if(!el)return;
    el.replaceChildren();el.append(new Option('Program nou / nesalvat','-1'));
    records.forEach((r,i)=>el.append(new Option(r.name+' · '+r.start,String(i))));
    el.value=String(selected);
  }
  function refreshEditor() {
    $('e10Name').value=current.name;
    $('e10Start').value=current.start;
    const host=$('e10Steps');host.replaceChildren();
    current.steps.forEach((s,i)=>{
      const row=create('div','e10-step');
      const mode=create('label','',`Pas ${i+1} · Stare`);
      const select=create('select');select.setAttribute('aria-label',`Starea pasului ${i+1}`);
      ['ON','OFF'].forEach(k=>select.append(new Option(k==='ON'?'Pompă ON':'Pompă OFF',k)));
      select.value=s.type;select.addEventListener('change',()=>{s.type=select.value;renderPreview();});mode.append(select);
      const duration=create('label','','Minute');const input=create('input');
      input.type='number';input.min='1';input.max='120';input.step='1';input.value=s.minutes;
      input.setAttribute('aria-label',`Durata pasului ${i+1}`);
      input.addEventListener('change',()=>{s.minutes=Number(input.value);renderPreview();});duration.append(input);
      const actions=create('div','e10-step-actions');
      [[`↑`,`Mută pasul ${i+1} în sus`,-1],[`↓`,`Mută pasul ${i+1} în jos`,1],[`×`,`Șterge pasul ${i+1}`,0]].forEach(([label,alt,move])=>{
        const btn=create('button','',label);btn.type='button';btn.setAttribute('aria-label',alt);
        btn.disabled=move===-1&&i===0 || move===1&&i===current.steps.length-1;
        btn.addEventListener('click',()=>{
          if(move===0) current.steps.splice(i,1);
          else [current.steps[i],current.steps[i+move]]=[current.steps[i+move],current.steps[i]];
          refreshEditor();renderPreview();
        });actions.append(btn);
      });
      row.append(mode,duration,actions);host.append(row);
    });
  }
  function minutesOf(t) {return Math.round(t/60*10)/10;}

  // All values in this form are SYNTHETIC. These are NEVER automatically loaded
  // from the greenhouse telemetry and are never eligible for a real START.
  function readClimateForm() {
    const val=id=>$(id).value.trim()===''?NaN:Number($(id).value);
    const maxAgeMs=val('e10MaxAge')*1000,nowMs=1_000_000;
    const make=(source,prefix)=>({
      source,present:!$(prefix+'Missing').checked,online:!$(prefix+'Missing').checked,
      acceptedProvenance:!$(prefix+'Untrusted').checked,
      temperatureC:val(prefix+'Temp'),humidityPercent:val(prefix+'Rh'),
      climateReceivedMs:nowMs-($(prefix+'Stale').checked?maxAgeMs+5000:1000)
    });
    const pair={sera1:make(1,'e10S1'),sera2:make(2,'e10S2')};
    const threshold=prefix=>({temperatureConfigured:true,humidityConfigured:true,
      temperatureAtLeastC:val(prefix+'MinTemp'),humidityAtMostPercent:val(prefix+'MaxRh')});
    const smart={enabled:true,configured:true,maxAgeMs,
      combine:val('e10Combine'),sera1:threshold('e10S1'),sera2:threshold('e10S2')};
    const adaptive={enabled:true,configured:true,baseMinutes:20,
      maxAgeMs,minFactorPercent:val('e10MinFactor'),
      lowTemperatureSet:true,highTemperatureSet:true,lowHumiditySet:true,highHumiditySet:true,
      lowTemperatureC:val('e10TempLow'),highTemperatureC:val('e10TempHigh'),
      lowHumidityPercent:val('e10RhLow'),highHumidityPercent:val('e10RhHigh')};

  function renderDecisions(plan) {
    const climate=readClimateForm();

      climate.smart,climate.adaptive,Engine);
    lastComparison={evaluation,climate};
    const table=$('e10DecisionTable');table.replaceChildren();
    const head=create('thead'),hrow=create('tr');
    ['Metodă','Stare','Total ON','Durată totală','Motiv'].forEach(v=>hrow.append(create('th','',v)));
    head.append(hrow);table.append(head);
    const body=create('tbody');
    evaluation.options.forEach(op=>{
      const tr=create('tr');
      const cells=[op.method,op.eligible?'Eligibilă (simulare)':'BLOCATĂ',
        op.result?asMinute(op.result.pumpSeconds):'—',
        op.result?asMinute(op.result.totalSeconds):'—',op.reason];
      cells.forEach(v=>tr.append(create('td','',v)));

    const a=evaluation.options[2];
    safeText($('e10DecisionNote'),a.eligible ?
      `ADAPTIVE: ${a.calculation.factorPercent}% din totalul ON (${evaluation.totalOn} min), `+
      `cu repartizare între pașii ON; pauzele OFF rămân neschimbate. `+
      `Sera de referință: ${a.calculation.climateDetails.selectedGreenhouse}.` :
      'ADAPTIVE indisponibilă: '+a.reason+'. Datele sunt introduse manual pentru SIMULARE.');
    const mode=$('e10Strategy').value;
    const chosen=evaluation.options.find(op=>op.method===mode);

    return chosen.plan;
  }
  function recordComparison() {
    if(!lastComparison){notice('Corectează întâi editorul sau datele pentru comparație.');return;}
    for(const op of lastComparison.evaluation.options){
      comparisonRecords.push(Modes.recordFromOption(op,comparisonNextId++,lastComparison.climate.pair,
        lastComparison.climate.nowMs,lastComparison.climate.maxAgeMs));
    }
    if(comparisonRecords.length>32)comparisonRecords=comparisonRecords.slice(-32);
    const output=$('e10ReadOnlyJournal');
    ComparisonUI.render(output,{available:true,truncated:comparisonNextId>33,records:comparisonRecords});
    notice('Trei DECIZII SIMULATE adăugate în jurnalul RAM al browserului. Zero START reale.');
  }
  function renderPreview() {
    lastComparison=null;
    const title=$('e10Name').value;
    current.name=title;
    current.start=$('e10Start').value;
    const rawFaultAt=$('e10FaultMinute').value.trim();
    let result;
    try {
      const safePlan=Engine.normalized(current);
      // FIX / SMART / ADAPTIVE select the SAME sequence editor and simulator.
      // Only the proposed ON steps may change. No API/control call here.
      const selectedPlan=renderDecisions(safePlan);
      const base=Engine.build(selectedPlan);
      if(fault!=='NONE') {
        const n=Number(rawFaultAt);
        if(rawFaultAt==='' || !Number.isFinite(n) || n<0 || !Number.isInteger(n*2)) throw new Error('Momentul defectului trebuie să fie în multipli de 0,5 minute.');

    } catch(e){
      preview=null;
      safeText($('e10Message'),e.message);
      $('e10Summary').replaceChildren();$('e10Timeline').replaceChildren();
      safeText($('e10Now'),'Corectează programul pentru simulare.');
      $('e10Scrub').disabled=true;$('e10History').replaceChildren();return;
    }
    const details=[
      ['Durată totală',asMinute(preview.totalSeconds)],
      ['Pompă ON',asMinute(preview.pumpSeconds)],
      ['Pauze programate',asMinute(preview.offSeconds)],
      ['Pauze de protecție',asMinute(preview.restSeconds)],
      ['Final',Engine.wallClock(preview.plan.start,preview.totalSeconds)]
    ];
    const summary=$('e10Summary');summary.replaceChildren();
    details.forEach(([k,v])=>summary.append(create('span','',k+': '+v)));
    const track=$('e10Timeline');track.replaceChildren();
    preview.segments.forEach(segment=>{
      const width=preview.totalSeconds ? (segment.to-segment.from)/preview.totalSeconds*100 : 0;
      const bar=create('div','e10-'+segment.state.toLowerCase());
      bar.style.width=width+'%';bar.title=`Pas ${segment.step}: ${segment.state} ${asMinute(segment.to-segment.from)}`;
      track.append(bar);
    });
    $('e10Scrub').disabled=false;
    $('e10Scrub').max=String(preview.totalSeconds);
    $('e10Scrub').step='30';
    $('e10Scrub').value='0';
    const history=$('e10History');history.replaceChildren();
    preview.segments.forEach((s,i)=>{
      if(i>=50)return;
      history.append(create('li','',Engine.wallClock(preview.plan.start,s.from)+
        ' · Pas '+s.step+' · '+s.state+' ('+asMinute(s.to-s.from)+')'));
    });
    if(preview.segments.length>50)history.append(create('li','','... '+(preview.segments.length-50)+' tranziții suplimentare'));
    if(preview.fault)history.append(create('li','',preview.event.message));
    scrub();
  }
  function scrub() {
    if(!preview) return;
    const t=Number($('e10Scrub').value)||0;
    const state=Engine.stateAt(preview,t);
    const label={ON:'POMPĂ ON (simulat)',OFF:'POMPĂ OFF (program)',REST:'POMPĂ OFF (protecție)',DONE:'FINALIZAT',FAULT:'DEFECT — OPRIT'};
    safeText($('e10Now'),Engine.wallClock(preview.plan.start,t)+': '+(label[state.state]||state.state)+
      (state.step?' · pasul '+state.step:'')+' · '+state.detail);
    safeText($('e10Elapsed'),asMinute(t)+' / '+asMinute(preview.totalSeconds));
  }
  function init() {
    const anchor=$('autoControlSection') || $('e10LabMount');
    if(!anchor || $('e10LabButton'))return;
    records=readSaved();
    const button=create('button','','Laborator secvențe · simulare');button.id='e10LabButton';button.type='button';
    // Important: not a real Start/Stop button. No API paths are used by this feature.
    const actions=$('r18QuickAdd')?.parentElement || anchor;
    actions.append(button);
    const modal=create('dialog');modal.id='e10LabDialog';modal.setAttribute('aria-labelledby','e10Title');
    modal.innerHTML=`
      <header><div><h2 id="e10Title">Laborator de secvențe</h2><small>E10 UNIFICAT · FIX / SMART / ADAPTIVE · fără START real</small></div><button class="e10-close" id="e10Close" type="button" aria-label="Închide">×</button></header>
      <div class="e10-body">
        <div class="e10-safe"><strong>SIMULARE OFFLINE.</strong> Nu comandă releul, nu salvează în ESP32, nu programează RTC. Programele sunt schițe locale, numai în acest browser. Protecția reală necesită confirmări hardware.</div>
        <label>Programe salvate în acest browser<select id="e10Saved"></select></label>
        <div class="e10-controls"><button type="button" id="e10New">Program nou</button><button type="button" id="e10Save" class="e10-primary">Salvează schița local</button><button type="button" id="e10Delete" class="e10-danger">Șterge schița</button></div>
        <h3>Editor de pași</h3><div class="e10-fields"><label>Nume<input id="e10Name" type="text" maxlength="60" autocomplete="off"></label><label>Ora ipotetică<input id="e10Start" type="time"></label></div>
        <div id="e10Steps" class="e10-steps" style="margin-top:12px"></div>
        <div class="e10-controls"><button type="button" id="e10AddOn">+ Pas ON</button><button type="button" id="e10AddOff">+ Pas OFF</button><button type="button" id="e10Reset">Revenire la exemplu</button></div>
        <div class="e10-info">Pe fiecare interval ON, simulăm segmente de maximum 4 minute și 30 secunde de pauză între segmente; protecția reală de 5 minute rămâne neschimbată. Pauzele suplimentare schimbă durata totală.</div>
        <h3>Metode de control — numai simulare</h3>
        <p class="e10-info"><strong>Date sintetice introduse manual.</strong> Temperatura și umiditatea sunt ale AERULUI; nu dovedesc umiditatea solului. Valorile sunt exemple de test, NU recomandări de udare. Nicio metodă nu poate arma sau porni pompa.</p>
        <label>Strategia afișată pe cronologie<select id="e10Strategy" data-e10-climate><option value="FIX">FIX — secvența originală</option><option value="SMART">SMART — pornește doar dacă regula este îndeplinită</option><option value="ADAPTIVE">ADAPTIVE — ajustează totalul ON</option></select></label>
        <div class="e10-climate-grid">
          <fieldset><legend>Sera 1 · aer simulat</legend>
            <label>Temperatură °C<input id="e10S1Temp" type="number" min="-40" max="85" step="0.1" value="30" data-e10-climate></label>
            <label>Umiditate relativă %<input id="e10S1Rh" type="number" min="0" max="100" step="0.1" value="40" data-e10-climate></label>
            <label>SMART: temperatură cel puțin °C<input id="e10S1MinTemp" type="number" min="-40" max="85" step="0.1" value="28" data-e10-climate></label>
            <label>SMART: umiditate cel mult %<input id="e10S1MaxRh" type="number" min="0" max="100" step="0.1" value="45" data-e10-climate></label>
            <label class="e10-check"><input id="e10S1Missing" type="checkbox" data-e10-climate> Nod lipsă</label>
            <label class="e10-check"><input id="e10S1Stale" type="checkbox" data-e10-climate> Date expirate</label>
            <label class="e10-check"><input id="e10S1Untrusted" type="checkbox" data-e10-climate> Sursă respinsă</label>
          </fieldset>
          <fieldset><legend>Sera 2 · aer simulat</legend>
            <label>Temperatură °C<input id="e10S2Temp" type="number" min="-40" max="85" step="0.1" value="32" data-e10-climate></label>
            <label>Umiditate relativă %<input id="e10S2Rh" type="number" min="0" max="100" step="0.1" value="38" data-e10-climate></label>
            <label>SMART: temperatură cel puțin °C<input id="e10S2MinTemp" type="number" min="-40" max="85" step="0.1" value="28" data-e10-climate></label>
            <label>SMART: umiditate cel mult %<input id="e10S2MaxRh" type="number" min="0" max="100" step="0.1" value="45" data-e10-climate></label>
            <label class="e10-check"><input id="e10S2Missing" type="checkbox" data-e10-climate> Nod lipsă</label>
            <label class="e10-check"><input id="e10S2Stale" type="checkbox" data-e10-climate> Date expirate</label>
            <label class="e10-check"><input id="e10S2Untrusted" type="checkbox" data-e10-climate> Sursă respinsă</label>
          </fieldset>
        </div>
        <div class="e10-climate-grid">
          <fieldset><legend>Regula SMART</legend>
            <label>Condiția serelor<select id="e10Combine" data-e10-climate><option value="2">AMBELE sere</option><option value="1">Cel puțin UNA</option></select></label>
            <label>Prospețime maximă, secunde<input id="e10MaxAge" type="number" min="1" max="5400" step="1" value="120" data-e10-climate></label>
            <p class="e10-info">Chiar în modul UNA, datele ambelor sere trebuie să fie valide și recente.</p>
          </fieldset>
          <fieldset><legend>Profilul ADAPTIVE</legend>
            <label>Factor minim %<input id="e10MinFactor" type="number" min="1" max="100" value="50" data-e10-climate></label>
            <label>Prag temperatură joasă / înaltă °C<div class="e10-pair"><input id="e10TempLow" type="number" min="-40" max="85" value="15" step="0.1" data-e10-climate><input id="e10TempHigh" type="number" min="-40" max="85" value="35" step="0.1" data-e10-climate></div></label>
            <label>Prag umiditate joasă / înaltă %<div class="e10-pair"><input id="e10RhLow" type="number" min="0" max="100" value="30" step="0.1" data-e10-climate><input id="e10RhHigh" type="number" min="0" max="100" value="70" step="0.1" data-e10-climate></div></label>
            <p class="e10-info">Ajustează numai totalul minutelor ON, proporțional cu factorul. Pauzele OFF rămân identice.</p>
          </fieldset>
        </div>
        <h3>Comparație FIX / SMART / ADAPTIVE</h3>
        <div class="e10-table-wrap"><table id="e10DecisionTable" class="e10-decision-table" aria-label="Comparație între metode"></table></div>
        <p class="e10-info" id="e10DecisionNote"></p>
        <div class="e10-controls"><button id="e10RecordCompare" type="button">Adaugă comparația în jurnalul simulat</button></div>
        <details class="e10-comparison-details"><summary>Jurnal comparativ simulat (RAM browser)</summary><div id="e10ReadOnlyJournal" class="e10-table-wrap"></div></details>
        <h3>Simulare și defecte</h3><div class="e10-fields"><label>Scenariu<select id="e10Fault"><option value="NONE">Normal — fără defect</option><option value="LINK">Pierderea comunicației</option><option value="DRY">Lipsă apă</option><option value="BATTERY">Baterie critică</option><option value="RTC">Ceas RTC invalid</option></select></label><label>Defect la minutul<input id="e10FaultMinute" type="number" min="0" max="240" step="0.5" value="6" disabled></label></div>
        <div id="e10Message" class="e10-error" role="alert"></div><div id="e10Summary" class="e10-summary"></div>
        <div id="e10Timeline" class="e10-timeline" aria-label="Cronologie simulată"></div><div class="e10-legend"><span><i class="e10-dot"></i>ON</span><span><i class="e10-dot" style="background:#66808b"></i>OFF</span><span><i class="e10-dot" style="background:#d0ae72"></i>Pauză protecție</span></div>
        <div class="e10-current" id="e10Now" role="status"></div><label>Derulează timpul<input id="e10Scrub" class="e10-time" type="range" min="0" max="3600" step="30" value="0"></label><div id="e10Elapsed" class="e10-info"></div>
        <h3>Jurnal simulat</h3><ol id="e10History" class="e10-history"></ol>
        <p class="e10-info">Aceasta este o previzualizare deterministă a profilului dorit și a segmentării, nu o măsurătoare a pompei și nu o execuție a motorului Arduino. Integrarea reală necesită confirmări de releu, limitări hardware și teste E8–E9.</p>
      </div>`;
    document.body.append(modal);
    button.addEventListener('click',()=>{refreshEditor();renderPreview();if(typeof modal.showModal==='function')modal.showModal();else modal.setAttribute('open','');});
    $('e10Close').addEventListener('click',()=>modal.close());
    modal.addEventListener('click',e=>{if(e.target===modal) modal.close();});
    $('e10Name').addEventListener('input',renderPreview);
    $('e10Start').addEventListener('change',renderPreview);
    $('e10Scrub').addEventListener('input',scrub);
    $('e10Fault').addEventListener('change',()=>{fault=$('e10Fault').value;$('e10FaultMinute').disabled=fault==='NONE';renderPreview();});
    $('e10FaultMinute').addEventListener('change',renderPreview);
    document.querySelectorAll('[data-e10-climate]').forEach(el=>{el.addEventListener('change',renderPreview);el.addEventListener('input',renderPreview);});
    $('e10RecordCompare').addEventListener('click',recordComparison);
    $('e10AddOn').addEventListener('click',()=>addStep('ON'));
    $('e10AddOff').addEventListener('click',()=>addStep('OFF'));
    $('e10Reset').addEventListener('click',()=>{current=copy(Engine.DEFAULT_PLAN);selected=-1;updateSelect();refreshEditor();renderPreview();});
    $('e10New').addEventListener('click',()=>{current={version:1,name:'Program nou',start:'07:00',steps:[{type:'ON',minutes:4}]};selected=-1;updateSelect();refreshEditor();renderPreview();});
    $('e10Saved').addEventListener('change',()=>{selected=Number($('e10Saved').value);current=selected===-1?copy(Engine.DEFAULT_PLAN):copy(records[selected]);refreshEditor();renderPreview();});
    $('e10Save').addEventListener('click',()=>{
      let plan;try{plan=Engine.normalized(current);Engine.build(plan);}catch(e){notice(e.message);return;}
      if(selected<0) {if(records.length>=MAX_SAVED){notice('Maximum 8 schițe. Șterge una înainte de salvare.');return;}selected=records.length;records.push(plan);}
      else records[selected]=plan;
      if(persist()){updateSelect();notice('Schiță salvată LOCAL în acest browser; nu este armată pe ESP32.');}
    });
    $('e10Delete').addEventListener('click',()=>{
      if(selected<0){notice('Selectează o schiță salvată.');return;}
      records.splice(selected,1);selected=-1;current=copy(Engine.DEFAULT_PLAN);
      persist();updateSelect();refreshEditor();renderPreview();notice('Schiță ștearsă din browser.');
    });
    updateSelect();refreshEditor();renderPreview();
  }
  function addStep(type) {
    if(current.steps.length>=Engine.MAX_STEPS){notice('Maximum 16 pași.');return;}
    if(current.steps.length && current.steps[current.steps.length-1].type===type){notice('Alternează ON cu OFF.');return;}
    current.steps.push({type,minutes:type==='ON'?4:10});refreshEditor();renderPreview();
  }
  document.addEventListener('DOMContentLoaded',init);
})();

</script>
<script>document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('e10LabButton');if(b)b.click();});</script></body></html>
